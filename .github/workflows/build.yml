name: Build Tweak

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Compile HeJiaBypass
    runs-on: macos-14
    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          set -euo pipefail
          export THEOS=${{ github.workspace }}/theos
          git clone --depth 1 https://github.com/theos/theos.git "$THEOS"
          git -C "$THEOS" submodule update --init --depth 1 makefiles
          rm -rf "$THEOS/sdks"
          git clone --depth 1 https://github.com/theos/sdks.git "$THEOS/sdks"
          # vendor 预编译库（libsubstrate 等），缺失会导致 before-all 报错
          "$THEOS/bin/update-theos"
          echo "--- vendor ---"
          ls "$THEOS/vendor/lib" | head
          echo "--- sdks ---"
          ls "$THEOS/sdks" | grep -i iphoneos | head

      - name: Build
        run: |
          set -o pipefail
          export THEOS=${{ github.workspace }}/theos
          make clean || true
          make -j"$(sysctl -n hw.ncpu)" DEBUG=0 FINALPACKAGE=1 2>&1 | tee build.log

      - name: Show errors if failed
        if: failure()
        run: |
          echo "================ BUILD LOG (tail) ================"
          tail -80 build.log || true
          echo "================ error lines ================"
          grep -nE "error:|Error |undefined|not found" build.log || true

      - name: Collect artifacts
        if: success()
        run: |
          echo "--- dylib ---"
          find . -name "HeJiaBypass.dylib" -not -path "./theos/*" | tee dylibs.txt
          cat dylibs.txt | while read -r f; do
            echo "== $f"; file "$f"; lipo -info "$f" || true
          done

      - name: Upload dylib
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HeJiaBypass-dylib
          path: |
            **/HeJiaBypass.dylib
          if-no-files-found: error

      - name: Upload deb
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HeJiaBypass-deb
          path: packages/*.deb
          if-no-files-found: ignore
