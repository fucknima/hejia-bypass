name: Build Tweak

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Compile HeJiaBypass
    runs-on: macos-14
    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Theos
        run: |
          set -e
          export THEOS=${{ github.workspace }}/theos
          # Theos 本体（不拉子模块，避免 sdks 目录冲突）
          git clone --depth 1 https://github.com/theos/theos.git "$THEOS"
          git -C "$THEOS" submodule update --init --depth 1 makefiles
          # 官方 SDK 仓库
          rm -rf "$THEOS/sdks"
          git clone --depth 1 https://github.com/theos/sdks.git "$THEOS/sdks"
          # 下载 vendor 预编译库（libsubstrate / libhooker 等），缺少会报
          # "The vendor/include and/or vendor/lib directories are missing"
          "$THEOS/bin/update-theos" || bash "$THEOS/bin/update-theos.sh"
          ls "$THEOS/vendor" 2>/dev/null && ls "$THEOS/vendor/lib" 2>/dev/null | head
          # 选一个可用的 SDK（优先 16.5）
          ls "$THEOS/sdks" | grep -i iphoneos | head -20

      - name: Build
        run: |
          export THEOS=${{ github.workspace }}/theos
          make clean || true
          make -j"$(sysctl -n hw.ncpu)" DEBUG=0 FINALPACKAGE=1

      - name: Locate artifacts
        run: |
          find .theos -name '*.dylib' -o -name '*.deb' | head -20

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: HeJiaBypass-dylib
          path: .theos/obj/**/*.dylib
          if-no-files-found: warn

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: HeJiaBypass-deb
          path: packages/*.deb
          if-no-files-found: ignore
